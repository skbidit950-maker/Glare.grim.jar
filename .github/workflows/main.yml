
name: Custom Client Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 26.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract Forge project
        run: |
          ZIP="CustomClient_Forge_26.2_65.1.6_Fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Build Forge mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomClient-Forge-26.2
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
